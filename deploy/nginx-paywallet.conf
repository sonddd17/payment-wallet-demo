# Nginx reverse proxy: sonddd.site -> ứng dụng Spring Boot ở 127.0.0.1:8080
#
# Luồng mã hóa đầu-cuối:  Khách --HTTPS--> Cloudflare --HTTPS (Full strict)--> Nginx :443 --> app
# - Chứng chỉ origin: Let's Encrypt (certbot, phương thức webroot, tự gia hạn).
# - Chỉ chấp nhận kết nối từ IP của Cloudflare: biến $from_cloudflare do file
#   /etc/nginx/conf.d/00-cloudflare.conf sinh ra (xem deploy/cloudflare-ips.sh).

# Cổng 80: chỉ phục vụ xác thực Let's Encrypt, còn lại chuyển sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sonddd.site www.sonddd.site;

    if ($from_cloudflare = 0) { return 444; }

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sonddd.site www.sonddd.site;

    if ($from_cloudflare = 0) { return 444; }

    ssl_certificate     /etc/letsencrypt/live/sonddd.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonddd.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 5m;

    # Gia hạn chứng chỉ vẫn chạy khi Cloudflare gọi về cổng 443
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
