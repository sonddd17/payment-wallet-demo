# Nginx reverse proxy: sonddd.site -> ứng dụng Spring Boot ở 127.0.0.1:8080
# Đứng sau Cloudflare (SSL Flexible): khách dùng HTTPS tới Cloudflare,
# Cloudflare gọi về đây qua HTTP và gửi kèm X-Forwarded-Proto: https.

# Giữ giao thức gốc do Cloudflare báo; nếu không có thì dùng giao thức hiện tại
map $http_x_forwarded_proto $origin_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name sonddd.site www.sonddd.site;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_proto;
        proxy_read_timeout 60s;
    }
}
